<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sourang File Integrity Audit Report</title>
<style>
  :root {
    --bg-dark: #0a0e17;
    --card-bg: rgba(18, 26, 43, 0.85);
    --border-color: rgba(0, 242, 254, 0.25);
    --text-primary: #e0f2fe;
    --text-muted: #94a3b8;
    --cyan: #00f2fe;
    --green: #10b981;
    --red: #f43f5e;
    --yellow: #f59e0b;
  }
  body {
    background: radial-gradient(circle at 50% 20%, #111e38 0%, #060911 100%);
    color: var(--text-primary);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 30px;
  }
  .container { max-width: 1100px; margin: auto; }
  .header {
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 20px;
    margin-bottom: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .title { font-size: 26px; font-weight: 800; letter-spacing: 1px; color: var(--cyan); }
  .badge {
    padding: 8px 18px;
    border-radius: 9999px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: #00f2fe22;
    color: #00f2fe;
    border: 1px solid #00f2fe;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .stat-val { font-size: 32px; font-weight: 800; margin-top: 6px; }
  .stat-lbl { font-size: 12px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 26px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  h2 { margin-top: 0; font-size: 18px; color: var(--cyan); letter-spacing: 0.5px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
  th { background: rgba(0, 242, 254, 0.08); color: var(--cyan); text-transform: uppercase; font-size: 11px; }
  .hash { font-family: monospace; font-size: 12px; color: #a5f3fc; word-break: break-all; }
  .tag {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .tag-mod { background: #f43f5e22; color: #f43f5e; border: 1px solid #f43f5e; }
  .tag-new { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b; }
  .tag-del { background: #94a3b822; color: #94a3b8; border: 1px solid #94a3b8; }
  .tag-ok  { background: #10b98122; color: #10b981; border: 1px solid #10b981; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <div class="title">🛡️ SOURANG FILE INTEGRITY CHECKER</div>
      <div style="color:var(--text-muted); font-size:13px; margin-top:4px;">
        Cryptographic Audit Report • Generated: 2026-10-13T11:43:40.519176+00:00
      </div>
    </div>
    <div class="badge">VERIFIED - 100% INTACT</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-lbl">Integrity Score</div>
      <div class="stat-val" style="color: #00f2fe;">100.0%</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Intact Files</div>
      <div class="stat-val" style="color: var(--green);">5</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Modified / Tampered</div>
      <div class="stat-val" style="color: var(--red);">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">New Files</div>
      <div class="stat-val" style="color: var(--yellow);">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Missing / Deleted</div>
      <div class="stat-val" style="color: var(--text-muted);">0</div>
    </div>
  </div>

</div>
</body>
</html>
